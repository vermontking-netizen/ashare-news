name: 更新 A股资讯快照

on:
  schedule:
    # 交易日盘中（北京时间 09:00–11:50、13:00–15:50，UTC 为 01:00–03:50、05:00–07:50），每 10 分钟
    - cron: "*/10 1-3 * * 1-5"
    - cron: "*/10 5-7 * * 1-5"
    # 非交易时段：每天 6 次（北京时间 08:00 / 12:00 / 16:00 / 20:00 / 00:00 / 04:00）
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成快照
        run: python fetch_news.py

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/archive.json data/news.js
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "chore: 更新资讯快照 $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
